name: Verificación continua

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: ${{ matrix.unidad }} · tipos, pruebas y aceptación
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        unidad: [unidad-1, unidad-2]

    defaults:
      run:
        working-directory: backend/${{ matrix.unidad }}

    steps:
      - uses: actions/checkout@v4

      # Node 22.18 o superior: ejecuta TypeScript sin compilar.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: backend/${{ matrix.unidad }}/package-lock.json

      # `npm ci` instala exactamente lo que fija el lock: la instalación es
      # reproducible y un lock desactualizado hace fallar el pipeline.
      - name: Instalar con bloqueo
        run: npm ci

      - name: Verificar tipos
        run: npm run check

      - name: Pruebas unitarias y de contrato
        run: npm test

      - name: Escenarios de aceptación
        run: npm run aceptacion

      # Sólo la unidad 1 tiene configurado el reporte de cobertura.
      - name: Cobertura
        if: matrix.unidad == 'unidad-1'
        run: npm run coverage

      - name: Publicar reporte de cobertura
        if: always() && matrix.unidad == 'unidad-1'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.unidad }}
          path: backend/${{ matrix.unidad }}/coverage/
          if-no-files-found: warn
